name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.9

      - name: Lint
        run: ruff check .

      - name: Syntaxe et imports
        run: |
          python -m py_compile slack-monitor.py
          python -c "import slack_bolt, kubernetes, docker, psutil"
